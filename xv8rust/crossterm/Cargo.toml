[package]
name = "crossterm"
version = "0.29.0"
description = "Cross-platform terminal library (vendored for xv8)"
license = "MIT"
edition = "2021"

[lib]
name = "crossterm"
path = "src/lib.rs"

[features]
default = ["bracketed-paste", "libc", "events"]
bracketed-paste = []
events = ["dep:mio", "dep:signal-hook", "dep:signal-hook-mio"]

[dependencies]
bitflags = "2.9"
spin = "0.9"

[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
parking_lot = "0.12"

[target.'cfg(target_arch = "riscv64")'.dependencies]
xv8-libc = { path = "../xv8-libc" }
std = { package = "xv8-user-std", path = "../xv8-user-std" }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false, optional = true }
rustix = { version = "0.38", features = ["termios", "fs", "stdio"], default-features = false, optional = true }
mio = { version = "1.0", features = ["os-poll"], optional = true }
signal-hook = { version = "0.3.17", optional = true }
signal-hook-mio = { version = "0.2.4", features = ["support-v1_0"], optional = true }

[lints.rust]
unexpected_cfgs = { level = "allow" }